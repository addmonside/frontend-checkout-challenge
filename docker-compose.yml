services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: checkout-api:local
    ports:
      - '${API_HOST_PORT:-4000}:${PORT:-4000}'
    environment:
      HOST: '${HOST:-0.0.0.0}'
      PORT: '${PORT:-4000}'
      DATA_FILE: '${DATA_FILE:-/app/.data/store.json}'
      PAYMENT_DELAY_MS: '${PAYMENT_DELAY_MS:-3000}'
    volumes:
      - api-data:/app/.data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: checkout-web:local
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    environment:
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:4000}'
      NEXT_PUBLIC_DEVTOOLS_ENABLED: '${NEXT_PUBLIC_DEVTOOLS_ENABLED:-true}'
      NEXT_PUBLIC_API_URL_FOR_SERVER_COMPONENTS: '${NEXT_PUBLIC_API_URL_FOR_SERVER_COMPONENTS:-http://api:4000}'
      WATCHPACK_POLLING: '${WATCHPACK_POLLING:-true}'
      CHOKIDAR_USEPOLLING: '${CHOKIDAR_USEPOLLING:-true}'
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - web-app-node-modules:/app/apps/web/node_modules
      - web-next:/app/apps/web/.next
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
  web-node-modules:
  web-app-node-modules:
  web-next:
